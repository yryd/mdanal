[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdanal"
version = "0.1.0"
description = "Figure-first LAMMPS trajectory analysis: sources + figures -> Panel/Figure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MDAnalysis>=2.10",
    "tidynamics>=1.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scienceplots>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mdanal = "mdanal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdanal = ["config/*.yaml", "analyses/*.md", "analyses/**/*.md", "analyses/**/*.json"]


[tool.pytest.ini_options]
# 默认跑 figure-first 单元/e2e；需要真实大算例的断言可另加 marker。
testpaths = ["tests/figure"]
markers = ["analysis: 需要真实分析的科学断言（默认不跑）"]
