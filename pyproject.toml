[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdanal"
version = "0.1.0"
description = "通用 MD 分析层：按体系目录的 system.yaml 驱动 MDAnalysis 分析"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MDAnalysis>=2.10",
    "tidynamics>=1.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scienceplots>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mdanal = "mdanal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdanal = ["config/*.yaml", "analyses/*.md", "analyses/**/*.md"]


[tool.pytest.ini_options]
# 裸 pytest 只跑框架与内置插件烟测；科学断言用 pytest tests/analyses 显式跑
testpaths = ["tests/framework", "tests/smoke"]
markers = ["analysis: 需要真实分析的科学断言（默认不跑）"]
