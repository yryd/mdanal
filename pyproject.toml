[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdanal"
version = "0.1.0"
description = "通用 MD 分析层：按体系目录的 system.yaml 驱动 MDAnalysis 分析"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MDAnalysis>=2.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scienceplots>=2.1",
]

[project.optional-dependencies]
# 仅 velocity 分析需要；缺失时 check 会提示，其他分析不受影响
velocity = ["maicos>=0.12"]
dev = ["pytest>=8"]

[project.scripts]
mdanal = "mdanal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdanal = ["*.yaml"]
