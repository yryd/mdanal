api_version: 1

# 每个键是一个分析名。system.yaml 的 analyses[].name 引用这里的键。
# slots 决定该分析需要几个 -sel（在 system.yaml 里是 sel 列表的长度与顺序）。

density:
  module: analyses.density
  slots: [group]
  params:
    delta: 1.0
    sum_axis: y
  requires: []
  coordinates: in_box
  package: null
  labels:
    zh:
      title: 密度投影
      cbar: 数密度 (Å$^{-3}$)
      axis_x: $x$ (Å)
      axis_y: $y$ (Å)
      axis_z: $z$ (Å)
    en:
      title: Density projection
      cbar: number density (Å$^{-3}$)
      axis_x: $x$ (Å)
      axis_y: $y$ (Å)
      axis_z: $z$ (Å)

lineardensity:
  module: analyses.lineardensity
  slots: [group]
  params:
    binsize: 0.5
    dim: z
  requires: []
  package: null
  labels:
    zh:
      title: 线密度
      axis_x: $x$ (Å)
      axis_y: $y$ (Å)
      axis_z: $z$ (Å)
      mass: 质量密度 (g cm$^{-3}$)
      charge: 电荷密度 (e Å$^{-3}$)
    en:
      title: Linear density
      axis_x: $x$ (Å)
      axis_y: $y$ (Å)
      axis_z: $z$ (Å)
      mass: mass density (g cm$^{-3}$)
      charge: charge density (e Å$^{-3}$)

rdf:
  module: analyses.rdf
  slots: [a, b]
  params:
    range: [0.5, 6.0]
    nbins: 60
  requires: []
  package: null
  labels:
    zh:
      title: 径向分布函数
      x: $r$ (Å)
      y: $g(r)$
    en:
      title: Radial distribution function
      x: $r$ (Å)
      y: $g(r)$

hbond:
  module: analyses.hbond
  slots: [donor, hydrogen, acceptor]
  params:
    d_a_cutoff: 3.5
    d_h_a_angle_cutoff: 150
  requires: []
  package: null
  labels:
    zh:
      title: 氢键数
      x: 时间 (ps)
      y: 氢键数
    en:
      title: Hydrogen bonds
      x: time (ps)
      y: hydrogen bonds

hbond_type:
  module: analyses.hbond_type
  slots: [donor, hydrogen, acceptor]
  params:
    d_a_cutoff: 3.5
    d_h_a_angle_cutoff: 150
    figure_axis: rate      # rate = 每帧平均，total = 总次数
  requires: []
  package: null
  labels:
    zh:
      title: 氢键类型分布
      count: 次数
      rate: 每帧平均次数
    en:
      title: Hydrogen bond types
      count: count
      rate: per-frame average

hbond_lifetime:
  module: analyses.hbond_lifetime
  slots: [donor, hydrogen, acceptor]
  params:
    d_a_cutoff: 3.5
    d_h_a_angle_cutoff: 150
    tau_max_ps: 20          # 最大滞后时间（ps），按帧间隔换算成帧
    intermittency: 1        # 间歇判据容忍的断帧数
    window_step: 1          # 时间原点取样步长；调大可加速
  requires: []
  package: null
  labels:
    zh:
      title: 氢键寿命
      x: 滞后 (ps)
      y: $C(\tau)$
      cont: 连续
      inter: 间歇（容忍 {n} 帧）
    en:
      title: Hydrogen bond lifetime
      x: lag (ps)
      y: $C(\tau)$
      cont: continuous
      inter: intermittent ({n} frame tolerance)

msd:
  module: analyses.msd
  slots: [group]
  params:
    msd_type: xyz
    fft: true
  requires: []
  coordinates: continuous
  package: null
  labels:
    zh:
      title: 均方位移
      x: $\Delta t$ (ps)
      y: MSD (Å$^{2}$)
    en:
      title: Mean squared displacement
      x: $\Delta t$ (ps)
      y: MSD (Å$^{2}$)

velocity:
  module: analyses.velocity
  slots: [group, ref]
  params:
    dim: z
    vdim: x
    bin_width: 1.0
    grouping: molecules
    sym: false
  requires: [velocities]
  package:
    name: maicos
    min_version: "0.12"
  labels:
    zh:
      title: 流速剖面
      axis_x: $x$ (Å)
      axis_y: $y$ (Å)
      axis_z: $z$ (Å)
      v_x: $v_x$ (Å ps$^{-1}$)
      v_y: $v_y$ (Å ps$^{-1}$)
      v_z: $v_z$ (Å ps$^{-1}$)
    en:
      title: Velocity profile
      axis_x: $x$ (Å)
      axis_y: $y$ (Å)
      axis_z: $z$ (Å)
      v_x: $v_x$ (Å ps$^{-1}$)
      v_y: $v_y$ (Å ps$^{-1}$)
      v_z: $v_z$ (Å ps$^{-1}$)
